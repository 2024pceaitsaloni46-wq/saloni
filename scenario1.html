<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinner Bill Splitter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .calculator-card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 360px;
    }
    h2 {
      margin-top: 0;
      color: #2c3e50;
      text-align: center;
    }
    .input-group {
      margin-bottom: 1.2rem;
    }
    label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      color: #34495e;
    }
    input {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #ccd1d1;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #2ecc71;
    }
    .results {
      background-color: #eafaf1;
      padding: 1.2rem;
      border-radius: 8px;
      margin-top: 1.5rem;
      border: 1px solid #a9dfbf;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.6rem;
      font-size: 1rem;
      color: #2c3e50;
    }
    .result-row.total-person {
      border-top: 1px solid #a9dfbf;
      padding-top: 0.6rem;
      margin-bottom: 0;
      font-weight: bold;
      font-size: 1.2rem;
      color: #1e8449;
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    <h2>Dinner Bill Splitter</h2>

    <div class="input-group">
      <label for="bill">Bill Amount (Rs)</label>
      <input type="number" id="bill" value="1200" min="0" oninput="calculateSplit()">
    </div>

    <div class="input-group">
      <label for="tip">Tip Percentage (%)</label>
      <input type="number" id="tip" value="10" min="0" oninput="calculateSplit()">
    </div>

    <div class="input-group">
      <label for="people">Number of People</label>
      <input type="number" id="people" value="4" min="1" oninput="calculateSplit()">
    </div>

    <div class="results">
      <div class="result-row">
        <span>Tip Amount:</span>
        <span id="tipAmount">Rs 120.00</span>
      </div>
      <div class="result-row">
        <span>Total Bill (with Tip):</span>
        <span id="totalBill">Rs 1320.00</span>
      </div>
      <div class="result-row total-person">
        <span>Each Person Pays:</span>
        <span id="perPerson">Rs 330.00</span>
      </div>
    </div>
  </div>

  <script>
    function calculateSplit() {
      const bill = parseFloat(document.getElementById('bill').value) || 0;
      const tipPercent = parseFloat(document.getElementById('tip').value) || 0;
      const people = parseInt(document.getElementById('people').value) || 1;

      const validPeople = people < 1 ? 1 : people;

      const tipAmount = bill * (tipPercent / 100);
      const totalBill = bill + tipAmount;
      const perPerson = totalBill / validPeople;

      document.getElementById('tipAmount').textContent = `Rs ${tipAmount.toFixed(2)}`;
      document.getElementById('totalBill').textContent = `Rs ${totalBill.toFixed(2)}`;
      document.getElementById('perPerson').textContent = `Rs ${perPerson.toFixed(2)}`;
    }

    calculateSplit();
  </script>

</body>
</html>
